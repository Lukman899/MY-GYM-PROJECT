<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VELIX GYM</title>

    <!-- Montserrat Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="output.css">

    <style>
        body {
            background-color: black;
            color: white;
        }

        body.dark-mode {
            background-color: white;
            color: black;
        }

        .heading {
            font-family: "Montserrat", sans-serif;
        }

        .outline-text {
            color: transparent;
            -webkit-text-stroke: 1px #777;
        }
    </style>

</head>

<body>

    <div>

        <!-- DARK/LIGHT MODE BUTTON -->
        <button id="themeBtn" class="absolute top-5 right-5 text-3xl cursor-pointer">
            🌙
        </button>


        <!-- HEADING -->
        <h1 class="heading text-center text-5xl font-extrabold pt-10">
            <span class="outline-text">FLEXIBLE</span>

            <span>PLANS FOR</span>

            <br>

            <span>EVERY BUDGET</span>

        </h1>
        <br>
        <small class=" text-gray-400 text-center pl-125">Choose a plan that suits you. No long-term Commitments
            required.</small>



        <section class="border border-gray-500  w-80 h-100 bg-transparent text-[##EEEEEE]">
            <article class="font-extrabold ">
                <h1 class="text-center">Basic Plan</h1>
                <div class="text-lime-500 p-2 font-extrabold text-center ">
                    <span class="text-4xl font-serif ">$39</span>
                    <span class="text-sm">/month</span>
                </div>

                <div class="bg-zinc-600 border-transparent w-80 text-center ">
                    <p class="gap-3 m-3 p-2 w=60 h-10 font-normal">3 DAYS/WEEK</p>


                    <div class="flex gap-2 items-center p-2">
                        <svg class="w-4 h-4">
                            <img src="Untitled.svg" alt="" width="25" height="25">
                        </svg>
                        <p class="flex">Access All Cardio Classes</p>
                    </div>


                    <div class="flex gap-2 items-center p-2">
                        <svg class="w-4 h-4">
                            <img src="Untitled.svg" alt="" width="25" height="25">
                        </svg>
                        <p class="flex">Monthly Body Assessment</p>
                    </div>


                    <div class="flex gap-2 items-center p-2">
                        <svg class="w-4 h-4">
                            <img src="Untitled.svg" alt="" width="25" height="25">
                        </svg>
                        <p class="flex">Nutritional Guide</p>
                    </div>



                </div>
            </article>
        </section>


    </div>

    <script src="index.js"></script>

</body>

</html>
